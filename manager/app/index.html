<!doctype html>
<html><head><meta charset="utf-8"><title>CleanYourTV</title>
<meta name="viewport" content="width=1920">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#f5f6f8;--ink2:rgba(245,246,248,.62);--night:#07080b;--font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font)}
#head{position:absolute;left:96px;top:70px;width:600px}
#head h1{font-size:76px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
#head p{margin-top:18px;font-size:28px;color:var(--ink2);line-height:1.4}
#panel{position:absolute;left:820px;top:60px;width:1000px;display:flex;flex-direction:column;gap:12px}
#banner{min-height:64px;padding:16px 34px;border-radius:30px;font-size:28px;line-height:1.3;background:#1c1e24;color:var(--ink2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#banner.work{color:var(--ink)}#banner.err{color:#ff9a8a}#banner.ok{color:#9be3b0}
.row{display:flex;align-items:center;gap:22px;height:84px;padding:0 34px;border-radius:30px;font-size:30px;font-weight:500;background:#1a1c22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:24px;opacity:.7;white-space:nowrap}
.row.dim{opacity:.55}
.row.f{background:var(--ink);color:#0b0c10;opacity:1}
.sep{height:14px}
</style></head><body>
<div id="head"><h1>CleanYourTV</h1><p id="sub"></p></div>
<div id="panel"><div id="banner"></div><div id="list"></div></div>
<script>
var API='http://127.0.0.1:8765', SVC='/media/developer/apps/usr/palm/services/com.cleanyourtv.manager.service';
var st=null, rows=[], idx=0, view='main', pending=null, pollT=0, setup={debloat:true,inputKey:true}, offline=false, busyMsg='';
function $(i){return document.getElementById(i)}
function api(p,body){return new Promise(function(res,rej){var x=new XMLHttpRequest();x.open(body?'POST':'GET',API+p);x.timeout=30000;
  x.onload=function(){try{res(JSON.parse(x.responseText))}catch(e){rej(e)}};x.onerror=x.ontimeout=function(){rej(new Error('no answer'))};x.send(body?JSON.stringify(body):null)})}
function rootExec(cmd){return new Promise(function(res){try{var b=new PalmServiceBridge();b.onservicecallback=function(m){res(m)};
  b.call('luna://org.webosbrew.hbchannel.service/exec',JSON.stringify({command:cmd}))}catch(e){res(JSON.stringify({returnValue:false,errorText:String(e)}))}})}
function launch(id,params){try{var b=new PalmServiceBridge();b.onservicecallback=function(){};b.call('luna://com.webos.applicationManager/launch',JSON.stringify({id:id,params:params||{}}))}catch(e){}}
function onoff(v){return v?'On':'Off'}
function banner(text,cls){var b=$('banner');b.textContent=text||'';b.className=cls||'';b.style.display=text?'':'none'}

function build(){
  rows=[];
  if(offline){
    rows.push({label:'Debloat LG’s ads and telemetry',sub:onoff(setup.debloat),fn:function(){setup.debloat=!setup.debloat;build();draw()}});
    rows.push({label:'Take over the Input key',sub:onoff(setup.inputKey),fn:function(){setup.inputKey=!setup.inputKey;build();draw()}});
    rows.push({label:'Set up now',sub:'the screen blinks once',fn:doSetup});
    return}
  if(view==='confirm-restore'||view==='confirm-uninstall'){
    var un=view==='confirm-uninstall';
    rows.push({label:'Cancel',fn:function(){view='main';idx=0;build();draw()}});
    rows.push({label:un?'Yes, remove CleanYourTV':'Yes, restore LG’s Home',sub:un?'settings and apps are deleted':'until the next reboot',fn:function(){
      api(un?'/api/manager/uninstall':'/api/manager/restore',{}).catch(function(){});banner(un?'Removing CleanYourTV…':'Restoring LG’s Home…','work')}});
    return}
  var fe=st.frontend,sv=st.service,busy=st.job&&st.job.state==='working';
  rows.push({label:'Launcher '+fe.version,sub:fe.updateTo?'Update to '+fe.updateTo:(st.checking?'Checking…':(st.checkError?(/no release/.test(st.checkError)?'No release yet':'Cannot check'):'Up to date')),dim:busy,
    fn:fe.updateTo?function(){run('/api/manager/update-frontend',{version:fe.updateTo})}:null});
  rows.push({label:'Service '+sv.version,sub:sv.updateTo?'Update to '+sv.updateTo:(st.checking?'Checking…':(st.checkError?(/no release/.test(st.checkError)?'No release yet':'Cannot check'):'Up to date')),dim:busy,
    fn:sv.updateTo?function(){run('/api/manager/update-service',{version:sv.updateTo})}:null});
  rows.push({label:'Check for updates',dim:busy,fn:function(){banner('Checking…','work');api('/api/manager/check',{}).then(refreshDone,refreshDone)}});
  if(fe.previous)rows.push({label:'Go back to launcher '+fe.previous,dim:busy,fn:function(){run('/api/manager/rollback-frontend',{})}});
  rows.push({sep:true});
  rows.push({label:'Debloat LG’s ads and telemetry',sub:onoff(st.options.debloat),fn:function(){opt({debloat:!st.options.debloat})}});
  rows.push({label:'Input key opens our Inputs list',sub:st.inputhook&&st.inputhook.hooked&&st.options.inputKey?'On':onoff(st.options.inputKey),fn:function(){opt({inputKey:!st.options.inputKey})}});
  rows.push({sep:true});
  rows.push({label:'Open the launcher',fn:function(){launch('com.webos.app.home')}});
  rows.push({label:'Restore LG’s Home',sub:'until the next reboot',fn:function(){view='confirm-restore';idx=0;build();draw()}});
  rows.push({label:'Uninstall',fn:function(){view='confirm-uninstall';idx=0;build();draw()}});
}
function draw(){
  var h='';rows.forEach(function(r,i){h+=r.sep?'<div class="sep"></div>':'<div class="row'+(i===idx?' f':'')+(r.dim?' dim':'')+'" data-i="'+i+'"><span class="lb"></span>'+(r.sub?'<span class="st"></span>':'')+'</div>'});
  $('list').innerHTML=h;var el=$('list').children;rows.forEach(function(r,i){if(r.sep)return;el[i].querySelector('.lb').textContent=r.label;if(r.sub)el[i].querySelector('.st').textContent=r.sub});
  if(!offline&&st){var m=[];m.push('Launcher '+st.frontend.version+' · service '+st.service.version);
    if(st.checkError)m.push('Updates: '+st.checkError);else if(st.release)m.push('Latest release '+st.release.version);
    $('sub').textContent=m.join('\n');$('sub').style.whiteSpace='pre-line'}
  else $('sub').textContent=offline?'The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.':'';
}
function next(dir){var n=rows.length,i=idx;do{i=(i+dir+n)%n}while(rows[i].sep);idx=i;draw()}
function act(){var r=rows[idx];if(r&&r.fn&&!(st&&st.job&&st.job.state==='working'&&r.dim))r.fn()}

function refreshDone(){load(true)}
function run(path,body){api(path,body).then(function(r){if(r.error)banner(r.error,'err');else poll()},function(){banner('The service did not answer','err')})}
function opt(o){api('/api/manager/options',o).then(function(s){st=s;build();draw()},function(){banner('The service did not answer','err')})}
function poll(){clearTimeout(pollT);api('/api/manager/status').then(function(s){
  st=s;var j=s.job||{};
  if(j.state==='working'){banner(j.message,'work');build();draw();pollT=setTimeout(poll,1000)}
  else{if(j.state==='error')banner(j.message,'err');else if(j.state==='done')banner(j.message,'ok');else banner('');build();draw()}
},function(){banner('Waiting for the service…','work');pollT=setTimeout(poll,2000)})}
function load(keep){
  api('/api/manager/status').then(function(s){offline=false;st=s;
    if(s.job&&s.job.state==='working'){poll();return}
    if(!keep)banner('');
    build();if(idx>=rows.length)idx=0;draw();
    if(s.checking)setTimeout(function(){load(true)},2000)
  },function(){offline=true;build();draw();banner('')})}
function doSetup(){
  banner('Setting up… the screen blinks once while LG’s system restarts','work');
  var flags=(setup.debloat?'--debloat':'--no-debloat')+' '+(setup.inputKey?'--input-key':'--no-input-key');
  rootExec('nohup sh '+SVC+'/bootstrap.sh install '+flags+' > /tmp/cytv-bootstrap.log 2>&1 &').then(function(m){
    var o={};try{o=JSON.parse(m)}catch(e){}
    if(o.returnValue===false){banner('Could not start the setup: '+(o.errorText||'no root access (is the Homebrew Channel installed?)'),'err');return}
    waitUp(0)})}
function waitUp(n){api('/api/manager/status').then(function(){offline=false;banner('');load()},function(){
  if(n>90){banner('The service did not start. See /tmp/cytv-bootstrap.log on the TV.','err');return}
  setTimeout(function(){waitUp(n+1)},2000)})}

document.addEventListener('keydown',function(e){var k=e.keyCode;
  if(k===38)next(-1);else if(k===40)next(1);else if(k===13)act();
  else if(k===461||k===27||k===8||k===10009){if(view!=='main'){view='main';idx=0;build();draw()}else{try{window.close()}catch(x){}}}
  e.preventDefault()});
document.addEventListener('click',function(e){var r=e.target.closest&&e.target.closest('.row');if(r){idx=+r.getAttribute('data-i');draw();act()}});
document.addEventListener('mousemove',function(e){var r=e.target.closest&&e.target.closest('.row');if(r&&+r.getAttribute('data-i')!==idx){idx=+r.getAttribute('data-i');draw()}});
document.addEventListener('webOSRelaunch',function(){view='main';idx=0;load()});
banner('Reading status…','work');load();
</script></body></html>
