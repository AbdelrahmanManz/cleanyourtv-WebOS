<!doctype html>
<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<style>
:root{
  --ink:#f5f6f8; --ink2:rgba(245,246,248,.62); --night:#07080b; --panel:#14161b;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
::selection{background:rgba(255,255,255,.25)}

/* ambient light: two layers cross-fade when the focused app changes */
.glow{position:absolute;inset:0;opacity:0;transition:opacity .7s ease-out;
  background:
    radial-gradient(ellipse 1500px 820px at 26% -10%,rgba(var(--c),.58),transparent 68%),
    radial-gradient(ellipse 900px 600px at 92% 4%,rgba(var(--c),.20),transparent 70%)}
.glow.on{opacity:1}
#floor{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.55))}

/* top bar */
#top{position:absolute;left:96px;right:96px;top:52px;height:76px;display:flex;align-items:center;z-index:5}
#time{font-size:56px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:24px;color:var(--ink2);margin-left:22px;padding-top:14px}
#top .sp{flex:1}
.pill{display:flex;align-items:center;gap:14px;height:64px;padding:0 30px 0 24px;margin-left:16px;border-radius:32px;font-size:26px;font-weight:500;
  background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  transition:transform .25s var(--ease),background .2s,color .2s,box-shadow .25s}
.pill svg{width:30px;height:30px;flex:none}
.pill.f{background:var(--ink);color:#0b0c10;transform:scale(1.07);box-shadow:0 14px 34px rgba(0,0,0,.45)}

/* shelf */
#shelf{position:absolute;left:96px;right:96px;top:168px;height:110px;z-index:5}
#name{font-size:92px;font-weight:700;letter-spacing:-.028em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 4px 30px rgba(0,0,0,.35)}
#name.swap{animation:nameIn .45s var(--ease)}
@keyframes nameIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* scrolling content, softly faded where it slides under the shelf */
#view{position:absolute;inset:0;z-index:2;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 290px,#000 390px);
          mask-image:linear-gradient(to bottom,transparent 0,transparent 290px,#000 390px)}
#scroll{position:absolute;left:0;top:0;width:1920px;height:1080px;transition:transform .55s var(--ease)}
#dock{position:absolute;left:96px;top:410px;display:flex;gap:32px}
#grid{position:absolute;left:96px;top:740px;width:1728px;display:grid;grid-template-columns:repeat(10,151px);gap:26px 24px}

.tile{--c:74,84,112;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,rgba(var(--c),.66),rgba(var(--c),.20) 72%),var(--panel);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.05),0 10px 22px rgba(0,0,0,.35);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tile img{position:relative;z-index:1;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.tile svg{position:relative;z-index:1;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tile .t{position:relative;z-index:1;font-size:26px;font-weight:600;padding:12px;text-align:center;line-height:1.15;opacity:.9}
.tile::after{content:"";position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.20) 50%,transparent 62%) -120% 0/260% 100% no-repeat}
.tile.f{z-index:3;outline:4px solid rgba(255,255,255,.95);outline-offset:4px}
.tile.f::after{opacity:1;animation:sheen 1s var(--ease) forwards}
@keyframes sheen{to{background-position:120% 0}}

#dock .tile{width:408px;height:230px;border-radius:36px}
#dock .tile img{height:56%;max-width:46%}
#dock .tile svg{width:96px;height:96px}
#dock .tile.f{transform:translateY(-12px) scale(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 44px 70px -16px rgba(0,0,0,.75),0 20px 34px rgba(0,0,0,.5)}
#grid .tile{height:151px;border-radius:34px}
#grid .tile img{width:64%;height:64%}
#grid .tile svg{width:64px;height:64px}
#grid .tile.f{transform:scale(1.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 28px 46px -12px rgba(0,0,0,.75),0 14px 26px rgba(0,0,0,.5)}
#grid .tile.sys{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

.intro #dock .tile{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i)*80ms)}
.intro #grid .tile{animation:rise .9s var(--ease) backwards;animation-delay:calc(260ms + var(--i)*18ms)}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}

#toast{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:20;padding:16px 34px;border-radius:30px;font-size:24px;
  background:rgba(20,22,27,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 14px 40px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* inputs picker */
#ov{position:absolute;inset:0;z-index:30;background:rgba(5,6,9,.82);display:flex;align-items:center;justify-content:center;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
#ov .panel{width:700px;display:flex;flex-direction:column;gap:14px}
#ov h2{font-size:48px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.row{display:flex;align-items:center;gap:22px;height:92px;padding:0 34px;border-radius:26px;font-size:30px;font-weight:500;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .25s var(--ease),background .2s,color .2s}
.row svg{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lb{flex:1}
.row .st{font-size:22px;opacity:.65}
.row.f{background:var(--ink);color:#0b0c10;transform:scale(1.04)}
</style></head><body>
<div class="glow" id="gA"></div><div class="glow" id="gB"></div><div id="floor"></div>
<div id="top"><div id="time"></div><div id="date"></div><div class="sp"></div><div id="bar"></div></div>
<div id="shelf"><div id="name"></div></div>
<div id="view"><div id="scroll"><div id="dock"></div><div id="grid"></div></div></div>
<div id="toast"></div>
<script>
var API='http://127.0.0.1:8765';
var DEFAULTS={
  dock:['netflix','youtube.leanback.v4','amazon','com.disney.disneyplus-prod'],
  topbar:[{label:'Inputs',icon:'inputs',action:'inputs'},{label:'Settings',icon:'settings',app:'com.palm.app.settings'}]
};
var ICONS={
  inputs:'<path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
  settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>',
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  power:'<path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
  tv:'<rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/>',
  grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  play:'<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>'
};
function svg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.grid)+'</svg>'}

var rows=[], r=1, c=0, colorCache={}, lastSig='', ov=null, oi=0, gSide=0, intro=true;
function $(id){return document.getElementById(id)}
var toastT;
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},4000)}
function api(p,body){return fetch(API+p,body?{method:'POST',body:JSON.stringify(body)}:{}).then(function(x){return x.json()})}
function launch(id,params){api('/api/launch',{id:id,params:params}).then(function(x){if(x&&x.returnValue===false)toast('Could not open '+id)})}

/* ---------- colour ---------- */
function hsl2rgb(h,s,l){var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}return [f(0),f(8),f(4)]}
function rgb2hsl(R,G,B){R/=255;G/=255;B/=255;var mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===R?((G-B)/d+(G<B?6:0)):mx===G?(B-R)/d+2:(R-G)/d+4;h*=60}return [h,s,l]}
function hashHue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
function iconColor(img,id){
  var out=null;
  try{
    var cv=document.createElement('canvas');cv.width=cv.height=24;var x=cv.getContext('2d');x.drawImage(img,0,0,24,24);
    var d=x.getImageData(0,0,24,24).data,R=0,G=0,B=0,W=0;
    for(var i=0;i<d.length;i+=4){var a=d[i+3]/255;if(a<.4)continue;var hs=rgb2hsl(d[i],d[i+1],d[i+2]);var w=a*(.15+hs[1]*hs[1]);R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
    if(W>0.5){var h=rgb2hsl(R/W,G/W,B/W);if(h[1]>.22)out=hsl2rgb(h[0],Math.max(.5,Math.min(h[1],.8)),Math.max(.36,Math.min(h[2],.52)))}
  }catch(e){}
  return out||hsl2rgb(hashHue(id),.42,.42)}
function applyColor(t){
  var a=t._a;if(!a||a.sys)return;
  var col=colorCache[a.id];
  if(!col){var im=t.querySelector('img');if(!im||!im.complete||!im.naturalWidth)return;col=colorCache[a.id]=iconColor(im,a.id)}
  t.style.setProperty('--c',col.join(','));
  if(rows[r]&&rows[r][c]===t)glow(t)}

/* ---------- tiles ---------- */
function tile(a){
  var d=document.createElement('div');d.className='tile'+(a.sys?' sys':'');d._a=a;
  if(a.sys){d.innerHTML=svg(a.icon);return d}
  var i=new Image();i.crossOrigin='anonymous';i.alt='';
  i.onload=function(){applyColor(d)};
  i.onerror=function(){i.remove();var t=document.createElement('div');t.className='t';t.textContent=a.title;d.appendChild(t);
    var h=hsl2rgb(hashHue(a.id),.42,.42);colorCache[a.id]=h;d.style.setProperty('--c',h.join(','))};
  i.src=API+'/icon/'+a.id;d.appendChild(i);return d}

function glow(t){
  var col=t.style.getPropertyValue('--c')||'74,84,112';
  var on=gSide?$('gB'):$('gA'),off=gSide?$('gA'):$('gB');gSide^=1;
  on.style.setProperty('--c',col);on.classList.add('on');off.classList.remove('on')}

function setFocus(nr,nc){
  var old=rows[r]&&rows[r][c];if(old)old.classList.remove('f');
  r=nr;c=Math.min(nc,rows[r].length-1);var e=rows[r][c];e.classList.add('f');
  var a=e._a,nm=a?a.title:e.getAttribute('data-label');
  var n=$('name');if(n.textContent!==nm){n.textContent=nm;n.classList.remove('swap');void n.offsetWidth;n.classList.add('swap')}
  if(e.style.getPropertyValue('--c'))glow(e);else if(!e.classList.contains('pill')){/* colour pending */}else glow(e);
  var g=$('grid'),sh=0;
  if(r>=2){var top=740+e.offsetTop;sh=Math.min(0,Math.max(410-top,1000-(740+g.offsetHeight)))}
  $('scroll').style.transform=sh?'translateY('+sh+'px)':''}

function mapCol(from,to,col){return from>1?Math.round(col*(to-1)/(from-1)):0}
function move(nr,nc){setFocus(nr,nc)}

/* ---------- actions ---------- */
function act(e){
  var a=e._a;
  if(a){
    if(a.id==='__undo'){toast('Restoring LG Home (about 15 s, until next reboot)...');return void api('/api/undo',{})}
    return launch(a.id)}
  var o=e._o||{};
  if(o.action==='inputs')return showInputs();
  if(o.action==='restore'){toast('Restoring LG Home (about 15 s, until next reboot)...');return void api('/api/undo',{})}
  if(o.app)launch(o.app,o.params)}

function showInputs(){api('/api/inputs').then(function(x){
  var dv=(x.devices||[]).filter(function(d){return d.appId});
  ov=document.createElement('div');ov.id='ov';
  var p='<div class="panel"><h2>Inputs</h2>';
  dv.forEach(function(d,i){p+='<div class="row" data-i="'+i+'">'+svg('tv')+'<span class="lb"></span><span class="st">'+(d.hdmiPlugIn?'Connected':'')+'</span></div>'});
  ov.innerHTML=p+'</div>';
  document.body.appendChild(ov);
  [].forEach.call(ov.querySelectorAll('.row'),function(b,i){b._d=dv[i];b.querySelector('.lb').textContent=dv[i].label;b.addEventListener('click',function(){pick(b)})});
  oi=0;ovFocus(0)})}
function ovFocus(i){var k=ov.querySelectorAll('.row');if(!k.length)return;oi=Math.max(0,Math.min(k.length-1,i));for(var j=0;j<k.length;j++)k[j].classList.toggle('f',j===oi)}
function pick(b){closeOv();launch(b._d.appId)}
function closeOv(){if(ov){ov.remove();ov=null}}

function hit(e){e.addEventListener('click',function(){act(e)});e.addEventListener('mouseenter',function(){for(var i=0;i<rows.length;i++){var j=rows[i].indexOf(e);if(j>=0){setFocus(i,j);return}}})}

/* ---------- layout ---------- */
function layout(apps,cfg){
  cfg=cfg||{};
  var dockIds=cfg.dock&&cfg.dock.length?cfg.dock:DEFAULTS.dock;
  var by={};apps.forEach(function(a){by[a.id]=a});
  var dock=dockIds.map(function(i){return by[i]}).filter(Boolean).slice(0,4);
  var rest=apps.filter(function(a){return dock.indexOf(a)<0}).sort(function(a,b){return a.title.localeCompare(b.title)});
  rest.push({id:'__undo',title:'Restore LG Home',sys:true,icon:'restore'});
  $('dock').innerHTML='';$('grid').innerHTML='';$('bar').innerHTML='';
  var d=dock.map(function(a,i){var t=tile(a);t.style.setProperty('--i',i);$('dock').appendChild(t);return t});
  var g=rest.map(function(a,i){var t=tile(a);t.style.setProperty('--i',i);$('grid').appendChild(t);return t});
  $('bar').style.display='flex';
  var tb=(cfg.topbar&&cfg.topbar.length?cfg.topbar:DEFAULTS.topbar).map(function(o){
    var p=document.createElement('div');p.className='pill';p._o=o;p.setAttribute('data-label',o.label||'');
    p.innerHTML=svg(o.icon)+'<span></span>';p.lastChild.textContent=o.label||'';$('bar').appendChild(p);return p});
  rows=[tb,d.length?d:tb];
  for(var i=0;i<g.length;i+=10)rows.push(g.slice(i,i+10));
  rows.forEach(function(x){x.forEach(hit)});
  document.body.classList.toggle('intro',intro);intro=false;
  setFocus(Math.min(r,rows.length-1),c);
  [].forEach.call(document.querySelectorAll('.tile'),applyColor)}

function load(){api('/api/apps').then(function(x){
  var sig=JSON.stringify([x.apps.map(function(a){return a.id}),x.config]);
  if(sig===lastSig)return;lastSig=sig;layout(x.apps,x.config)
}).catch(function(){toast('Helper not reachable, retrying...');setTimeout(load,3000)})}

/* ---------- keys ---------- */
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(ov){if(k===38)ovFocus(oi-1);else if(k===40)ovFocus(oi+1);else if(k===13)pick(ov.querySelectorAll('.row')[oi]);else if(k===461||k===27||k===8)closeOv();else return;e.preventDefault();return}
  var len=rows[r].length;
  if(k===37&&c>0)setFocus(r,c-1);
  else if(k===39&&c<len-1)setFocus(r,c+1);
  else if(k===38&&r>0)setFocus(r-1,mapCol(len,rows[r-1].length,c));
  else if(k===40&&r<rows.length-1)setFocus(r+1,mapCol(len,rows[r+1].length,c));
  else if(k===13)act(rows[r][c]);
  else return;e.preventDefault()});
document.addEventListener('webOSRelaunch',load);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});

function tick(){var d=new Date();$('time').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  $('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,10000);tick();load();
</script></body></html>
