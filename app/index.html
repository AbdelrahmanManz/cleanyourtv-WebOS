<!doctype html>
<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<style>
/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. */
:root{
  --ink:#f5f6f8; --ink2:rgba(245,246,248,.62); --night:#07080b; --panel:#14161b;
  --font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font)}
::selection{background:rgba(255,255,255,.25)}

.glow{position:absolute;left:0;top:0;width:1920px;height:720px;opacity:0;transition:opacity .35s linear;will-change:opacity;
  background:radial-gradient(ellipse 1400px 640px at 26% -6%,rgba(var(--c),.55),transparent 70%)}
.glow.on{opacity:1}

#top{position:absolute;left:96px;right:96px;top:52px;height:76px;display:flex;align-items:center;z-index:5}
#time{font-size:56px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:24px;color:var(--ink2);margin-left:22px;padding-top:14px}
#top .sp{flex:1}
#bar{display:flex}
.pill{display:flex;align-items:center;gap:14px;height:64px;padding:0 30px 0 24px;margin-left:16px;border-radius:32px;font-size:26px;font-weight:500;
  background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);transition:transform .15s ease-out;will-change:transform}
.pill svg{width:30px;height:30px;flex:none}
.pill.f{background:var(--ink);color:#0b0c10;transform:scale(1.07)}

#shelf{position:absolute;left:96px;right:96px;top:162px;height:120px;z-index:5}
#name{font-size:92px;font-weight:700;letter-spacing:-.028em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the view clips rows as they scroll up under the shelf */
#view{position:absolute;left:0;top:300px;width:1920px;height:780px;overflow:hidden;z-index:2}
#scroll{position:absolute;left:0;top:0;width:1920px;height:780px;transition:transform .3s ease-out;will-change:transform}
#dock{position:absolute;left:96px;top:110px;display:flex;gap:32px}
#grid{position:absolute;left:96px;top:440px;width:1728px;display:grid;grid-template-columns:repeat(10,151px);gap:26px 24px}

.tile{--c:74,84,112;--b:20,22,27;position:relative;display:flex;align-items:center;justify-content:center;will-change:transform;
  background:rgb(var(--b));transition:transform .15s ease-out}
.tile img{object-fit:contain}
.tile svg{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tile .t{font-size:26px;font-weight:600;padding:12px;text-align:center;line-height:1.15;opacity:.9}
.tile.f{z-index:3;outline:4px solid rgba(255,255,255,.95);outline-offset:4px;box-shadow:0 24px 36px rgba(0,0,0,.6)}
#dock .tile{width:408px;height:230px;border-radius:36px}
#dock .tile img{height:56%;max-width:46%}
#dock .tile svg{width:96px;height:96px}
#dock .tile.f{transform:translateY(-10px) scale(1.05)}
#grid .tile{height:151px;border-radius:34px}
#grid .tile img{width:64%;height:64%}
#grid .tile svg{width:64px;height:64px}
#grid .tile.f{transform:scale(1.12)}
#grid .tile.sys{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

#toast{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:40;padding:16px 34px;border-radius:30px;font-size:24px;
  background:#14161b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);opacity:0;pointer-events:none}
#toast.on{opacity:1}

/* menus */
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:30;background:rgba(5,6,9,.97);display:flex;align-items:center;justify-content:center}
#ov .panel{width:760px;display:flex;flex-direction:column;gap:12px}
#ov h2{font-size:46px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:22px;height:84px;padding:0 34px;border-radius:26px;font-size:30px;font-weight:500;
  background:#1a1c22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:22px;opacity:.65}
.row.dim{opacity:.6}
.row.f{background:var(--ink);color:#0b0c10;opacity:1}
.more{height:22px;text-align:center;font-size:20px;color:var(--ink2)}
</style></head><body>
<div class="glow" id="gA"></div><div class="glow" id="gB"></div>

<script>

var DEFAULTS={

/* ---------- language and clock follow the TV ---------- */
var LOC=(window.webOSSystem&&webOSSystem.locale)||navigator.language||'en-GB', LANG=LOC.slice(0,2);
var TX={
 nl:{'Inputs':'Ingangen','Settings':'Instellingen','Customise':'Aanpassen','Open':'Openen','Move left in dock':'Naar links in dock','Move right in dock':'Naar rechts in dock','Remove from dock':'Uit dock verwijderen','Add to dock':'Aan dock toevoegen','Add to dock...':'Aan dock toevoegen...','Replace which app?':'Welke app vervangen?','Hide app':'App verbergen','Remove this button':'Deze knop verwijderen','hold OK on an app':'houd OK ingedrukt op een app','Hold OK on any app to change the dock':'Houd OK ingedrukt op een app om het dock te wijzigen','Top buttons':'Knoppen bovenaan','Hidden apps':'Verborgen apps','App order':'Volgorde van apps','Most used first':'Meest gebruikt eerst','A to Z':'A tot Z','Reset customisation':'Aanpassingen herstellen','Add a button...':'Knop toevoegen...','Add a button':'Knop toevoegen','An app...':'Een app...','Pick an app':'Kies een app','OK to remove':'OK om te verwijderen','Hidden apps (OK to show again)':'Verborgen apps (OK om te tonen)','No hidden apps':'Geen verborgen apps','Restore LG Home':'LG Home herstellen','Restoring LG Home (about 15 s, until next reboot)...':'LG Home wordt hersteld (ongeveer 15 s, tot de volgende herstart)...','Could not open':'Kan niet openen','Could not save settings':'Instellingen opslaan mislukt','Helper not reachable, retrying...':'Helper niet bereikbaar, opnieuw proberen...','Connected':'Verbonden','Active':'Actief','Clock':'Klok','Automatic':'Automatisch','24-hour':'24-uurs','12-hour':'12-uurs'},
 de:{'Inputs':'Eingänge','Settings':'Einstellungen','Customise':'Anpassen','Open':'Öffnen','Move left in dock':'Im Dock nach links','Move right in dock':'Im Dock nach rechts','Remove from dock':'Aus dem Dock entfernen','Add to dock':'Zum Dock hinzufügen','Add to dock...':'Zum Dock hinzufügen...','Replace which app?':'Welche App ersetzen?','Hide app':'App ausblenden','Remove this button':'Diese Schaltfläche entfernen','hold OK on an app':'OK auf einer App gedrückt halten','Hold OK on any app to change the dock':'Halte OK auf einer App gedrückt, um das Dock zu ändern','Top buttons':'Obere Schaltflächen','Hidden apps':'Ausgeblendete Apps','App order':'App-Reihenfolge','Most used first':'Meistgenutzte zuerst','A to Z':'A bis Z','Reset customisation':'Anpassungen zurücksetzen','Add a button...':'Schaltfläche hinzufügen...','Add a button':'Schaltfläche hinzufügen','An app...':'Eine App...','Pick an app':'App auswählen','OK to remove':'OK zum Entfernen','Hidden apps (OK to show again)':'Ausgeblendete Apps (OK zum Einblenden)','No hidden apps':'Keine ausgeblendeten Apps','Restore LG Home':'LG Home wiederherstellen','Restoring LG Home (about 15 s, until next reboot)...':'LG Home wird wiederhergestellt (ca. 15 s, bis zum nächsten Neustart)...','Could not open':'Konnte nicht geöffnet werden','Could not save settings':'Einstellungen konnten nicht gespeichert werden','Helper not reachable, retrying...':'Helper nicht erreichbar, neuer Versuch...','Connected':'Verbunden','Active':'Aktiv','Clock':'Uhr','Automatic':'Automatisch','24-hour':'24 Stunden','12-hour':'12 Stunden'},
 fr:{'Inputs':'Entrées','Settings':'Paramètres','Customise':'Personnaliser','Open':'Ouvrir','Move left in dock':'Déplacer à gauche dans le dock','Move right in dock':'Déplacer à droite dans le dock','Remove from dock':'Retirer du dock','Add to dock':'Ajouter au dock','Add to dock...':'Ajouter au dock...','Replace which app?':'Remplacer quelle app ?','Hide app':'Masquer l’app','Remove this button':'Supprimer ce bouton','hold OK on an app':'maintenez OK sur une app','Hold OK on any app to change the dock':'Maintenez OK sur une app pour modifier le dock','Top buttons':'Boutons du haut','Hidden apps':'Apps masquées','App order':'Ordre des apps','Most used first':'Les plus utilisées d’abord','A to Z':'De A à Z','Reset customisation':'Tout réinitialiser','Add a button...':'Ajouter un bouton...','Add a button':'Ajouter un bouton','An app...':'Une app...','Pick an app':'Choisir une app','OK to remove':'OK pour supprimer','Hidden apps (OK to show again)':'Apps masquées (OK pour afficher)','No hidden apps':'Aucune app masquée','Restore LG Home':'Rétablir LG Home','Restoring LG Home (about 15 s, until next reboot)...':'Rétablissement de LG Home (environ 15 s, jusqu’au prochain redémarrage)...','Could not open':'Impossible d’ouvrir','Could not save settings':'Impossible d’enregistrer les réglages','Helper not reachable, retrying...':'Assistant injoignable, nouvel essai...','Connected':'Connecté','Active':'Actif','Clock':'Horloge','Automatic':'Automatique','24-hour':'24 heures','12-hour':'12 heures'},
 es:{'Inputs':'Entradas','Settings':'Ajustes','Customise':'Personalizar','Open':'Abrir','Move left in dock':'Mover a la izquierda en el dock','Move right in dock':'Mover a la derecha en el dock','Remove from dock':'Quitar del dock','Add to dock':'Añadir al dock','Add to dock...':'Añadir al dock...','Replace which app?':'¿Qué app reemplazar?','Hide app':'Ocultar app','Remove this button':'Quitar este botón','hold OK on an app':'mantén OK en una app','Hold OK on any app to change the dock':'Mantén OK en una app para cambiar el dock','Top buttons':'Botones superiores','Hidden apps':'Apps ocultas','App order':'Orden de las apps','Most used first':'Más usadas primero','A to Z':'De la A a la Z','Reset customisation':'Restablecer personalización','Add a button...':'Añadir un botón...','Add a button':'Añadir un botón','An app...':'Una app...','Pick an app':'Elige una app','OK to remove':'OK para quitar','Hidden apps (OK to show again)':'Apps ocultas (OK para mostrar)','No hidden apps':'No hay apps ocultas','Restore LG Home':'Restaurar LG Home','Restoring LG Home (about 15 s, until next reboot)...':'Restaurando LG Home (unos 15 s, hasta el próximo reinicio)...','Could not open':'No se pudo abrir','Could not save settings':'No se pudieron guardar los ajustes','Helper not reachable, retrying...':'Helper no disponible, reintentando...','Connected':'Conectado','Active':'Activo','Clock':'Reloj','Automatic':'Automático','24-hour':'24 horas','12-hour':'12 horas'}
};
function t(k){var d=TX[LANG];return (d&&d[k])||k}
/* a button's label: built-in buttons are translated, buttons you added keep the app's own name */
function barLabel(o){return o.action==='inputs'?t('Inputs'):o.app==='com.palm.app.settings'?t('Settings'):o.action==='customize'?t('Customise'):(o.label||'')}
function clockOpts(){var c=cfg.clock,o={hour:'numeric',minute:'2-digit'};if(c==='24'){o.hourCycle='h23'}else if(c==='12'){o.hourCycle='h12';o.hour='numeric'}return o}

var apps=[], cfg={}, usage={}, warned=false, rows=[], r=1, c=0, colors={}, tiles={}, lastSig='', gSide=0, gColor='', gT=0, saveT=0;
function $(id){return document.getElementById(id)}
var toastT;
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},4000)}
function api(p,body){return fetch(API+p,body?{method:'POST',body:JSON.stringify(body)}:{}).then(function(x){return x.json()})}
function launch(id,params){api('/api/launch',{id:id,params:params}).then(function(x){if(x&&x.returnValue===false)toast(t('Could not open')+' '+id)})}
function store(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({apps:apps,cfg:cfg,usage:usage,colors:colors}))}catch(e){}}
function storeSoon(){clearTimeout(saveT);saveT=setTimeout(store,1500)}

/* ---------- colour (extracted once per app, then remembered) ---------- */
function hsl2rgb(h,s,l){var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}return [f(0),f(8),f(4)]}
function rgb2hsl(R,G,B){R/=255;G/=255;B/=255;var mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===R?((G-B)/d+(G<B?6:0)):mx===G?(B-R)/d+2:(R-G)/d+4;h*=60}return [h,s,l]}
function hashHue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
/* returns {c: vibrant colour for the glow, b: the icon's own edge colour for the tile background} */
function iconColor(img,id){
  var glow=null,edge=null,N=16;
  try{
    var cv=document.createElement('canvas');cv.width=cv.height=N;var x=cv.getContext('2d');x.drawImage(img,0,0,N,N);
    var d=x.getImageData(0,0,N,N).data,R=0,G=0,B=0,W=0,eR=0,eG=0,eB=0,eN=0,ring=0;
    for(var y=0;y<N;y++)for(var xx=0;xx<N;xx++){
      var i=(y*N+xx)*4,a=d[i+3]/255;
      if(y===0||y===N-1||xx===0||xx===N-1){ring++;if(a>.8){eR+=d[i];eG+=d[i+1];eB+=d[i+2];eN++}}
      if(a<.4)continue;var hs=rgb2hsl(d[i],d[i+1],d[i+2]);var w=a*(.15+hs[1]*hs[1]);R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
    if(eN>ring*.5)edge=[Math.round(eR/eN),Math.round(eG/eN),Math.round(eB/eN)];
    if(W>0.5){var h=rgb2hsl(R/W,G/W,B/W);if(h[1]>.22)glow=hsl2rgb(h[0],Math.max(.5,Math.min(h[1],.8)),Math.max(.36,Math.min(h[2],.52)))}
  }catch(e){}
  var fb=hsl2rgb(hashHue(id),.42,.42);
  glow=glow||(edge&&rgb2hsl(edge[0],edge[1],edge[2])[1]>.3?edge:fb);
  return {c:glow,b:edge||hsl2rgb(rgb2hsl(glow[0],glow[1],glow[2])[0],.4,.2)}}
function paint(d,col){d.style.setProperty('--c',col.c.join(','));d.style.setProperty('--b',col.b.join(','))}

/* ---------- tiles (built once per app, reused across rebuilds) ---------- */
function tile(a){
  if(tiles[a.id])return tiles[a.id];
  var d=document.createElement('div');d.className='tile'+(a.sys?' sys':'');d._a=a;
  tiles[a.id]=d;hit(d);
  if(a.sys){d.innerHTML=svg(a.icon);return d}
  var known=colors[a.id];
  if(known)paint(d,known);
  var i=new Image();i.alt='';i.decoding='async';
  if(!known)i.crossOrigin='anonymous';
  i.onload=function(){if(!colors[a.id]){colors[a.id]=iconColor(i,a.id);paint(d,colors[a.id]);storeSoon();if(rows[r]&&rows[r][c]===d)glowNow(d)}};
  i.onerror=function(){i.remove();var t=document.createElement('div');t.className='t';t.textContent=a.title;d.appendChild(t);
    if(!colors[a.id]){var f=hsl2rgb(hashHue(a.id),.42,.42);colors[a.id]={c:f,b:hsl2rgb(hashHue(a.id),.4,.2)};paint(d,colors[a.id])}};
  i.src=API+'/icon/'+encodeURIComponent(a.id);d.appendChild(i);
  return d}

/* ---------- ambient glow: two layers cross-fade, updated only once focus settles ---------- */
function glowNow(e){
  var col=e.style.getPropertyValue('--c')||'74,84,112';
  if(col===gColor)return;gColor=col;
  var on=gSide?$('gB'):$('gA'),off=gSide?$('gA'):$('gB');gSide^=1;
  on.style.setProperty('--c',col);on.classList.add('on');off.classList.remove('on')}
function glowSoon(e){clearTimeout(gT);gT=setTimeout(function(){glowNow(e)},110)}

function setFocus(nr,nc,first){
  var old=rows[r]&&rows[r][c];if(old)old.classList.remove('f');
  r=nr;c=Math.min(nc,rows[r].length-1);var e=rows[r][c];e.classList.add('f');
  var a=e._a,nm=a?a.title:(e._o?barLabel(e._o):''),n=$('name');
  if(n.textContent!==nm)n.textContent=nm;
  if(first)glowNow(e);else glowSoon(e);
  var sh=0;
  if(r>=2){var g=$('grid');sh=Math.min(0,Math.max(110-(440+e.offsetTop),760-(440+g.offsetHeight)))}
  $('scroll').style.transform=sh?'translateY('+sh+'px)':''}
function mapCol(from,to,col){return from>1?Math.round(col*(to-1)/(from-1)):0}
function posOf(e){for(var i=0;i<rows.length;i++){var j=rows[i].indexOf(e);if(j>=0)return [i,j]}return null}

/* ---------- config (edited in the launcher, saved through the helper) ---------- */
function saveCfg(){api('/api/config',cfg).catch(function(){toast(t('Could not save settings'))});store();rebuild()}
function isHidden(id){return (cfg.hidden||[]).indexOf(id)>=0}
function dockIds(){var by={};apps.forEach(function(a){by[a.id]=a});
  var ids=cfg.dock&&cfg.dock.length?cfg.dock:DEFAULTS.dock;
  return ids.filter(function(i){return by[i]&&!isHidden(i)}).slice(0,4)}
function setDock(ids){cfg.dock=ids.slice(0,4);saveCfg()}
function hideApp(id){cfg.hidden=(cfg.hidden||[]).concat(id);cfg.dock=dockIds().filter(function(i){return i!==id});saveCfg()}
function unhideApp(id){cfg.hidden=(cfg.hidden||[]).filter(function(i){return i!==id});saveCfg()}
function topbar(){return cfg.topbar?cfg.topbar:DEFAULTS.topbar}
function byOrder(a,b){
  if(cfg.sort!=='alpha'){var d=(usage[b.id]||0)-(usage[a.id]||0);if(Math.abs(d)>1e-9)return d>0?1:-1}
  return a.title.localeCompare(b.title)}
function title(id){for(var i=0;i<apps.length;i++)if(apps[i].id===id)return apps[i].title;return id}

/* ---------- actions ---------- */
function act(e){
  var a=e._a;
  if(a){
    if(a.id==='__undo'){toast(t('Restoring LG Home (about 15 s, until next reboot)...'));return void api('/api/undo',{})}
    return launch(a.id)}
  var o=e._o||{};
  if(o.action==='customize')return customizeMenu();
  if(o.action==='inputs')return inputsMenu();
  if(o.app)launch(o.app,o.params)}

/* ---------- menus ---------- */
var stack=[], ovEl=null;
function openMenu(title,items){stack.push({title:title,items:items,idx:0});drawMenu()}
function closeMenus(){stack=[];if(ovEl){ovEl.remove();ovEl=null}}
function backMenu(){stack.pop();if(stack.length)drawMenu();else closeMenus()}
function drawMenu(){
  var m=stack[stack.length-1],N=8,start=Math.max(0,Math.min(m.idx-3,m.items.length-N));
  if(!ovEl){ovEl=document.createElement('div');ovEl.id='ov';document.body.appendChild(ovEl)}
  var h='<div class="panel"><h2></h2><div class="more">'+(start>0?'▲':'')+'</div>';
  for(var i=start;i<Math.min(m.items.length,start+N);i++){
    var it=m.items[i];
    h+='<div class="row'+(i===m.idx?' f':'')+(it.dim?' dim':'')+'" data-i="'+i+'">'+(it.icon?svg(it.icon):'')+'<span class="lb"></span>'+(it.sub?'<span class="st"></span>':'')+'</div>'}
  h+='<div class="more">'+(start+N<m.items.length?'▼':'')+'</div></div>';
  ovEl.innerHTML=h;
  ovEl.querySelector('h2').textContent=m.title;
  [].forEach.call(ovEl.querySelectorAll('.row'),function(row){
    var it=m.items[+row.getAttribute('data-i')];
    row.querySelector('.lb').textContent=it.label;
    if(it.sub)row.querySelector('.st').textContent=it.sub;
    row.addEventListener('click',function(){m.idx=+row.getAttribute('data-i');pickMenu()})})}
function pickMenu(){var m=stack[stack.length-1],it=m.items[m.idx];if(it&&it.fn){var n=stack.length;it.fn();if(stack.length===n&&!it.stay)closeMenus()}}
function menuKey(k){
  var m=stack[stack.length-1];
  if(k===38&&m.idx>0){m.idx--;drawMenu()}
  else if(k===40&&m.idx<m.items.length-1){m.idx++;drawMenu()}
  else if(k===13)pickMenu();
  else if(k===461||k===27||k===8)backMenu();
  else return false;
  return true}

function inputsMenu(){api('/api/inputs').then(function(x){
  var items=(x.devices||[]).filter(function(d){return d.appId}).map(function(d){
    var port='HDMI '+d.port,named=d.label&&d.label!==port&&d.label!==('HDMI '+d.port),parts=[];
    if(named)parts.push(port);
    if(d.hdmiPlugIn)parts.push(t('Connected'));
    if(d.activate)parts.push(t('Active'));
    return {icon:'tv',label:d.label||port,sub:parts.join(' \u00B7 '),dim:!d.hdmiPlugIn,fn:function(){launch(d.appId)}}});
  openMenu(t('Inputs'),items)})}

function appMenu(a){
  var di=dockIds(),pos=di.indexOf(a.id),items=[{label:t('Open'),fn:function(){launch(a.id)}}];
  if(pos>=0){
    if(pos>0)items.push({label:t('Move left in dock'),fn:function(){var d=di.slice();d.splice(pos,1);d.splice(pos-1,0,a.id);setDock(d)}});
    if(pos<di.length-1)items.push({label:t('Move right in dock'),fn:function(){var d=di.slice();d.splice(pos,1);d.splice(pos+1,0,a.id);setDock(d)}});
    items.push({label:t('Remove from dock'),fn:function(){setDock(di.filter(function(i){return i!==a.id}))}})}
  else if(di.length<4)items.push({label:t('Add to dock'),fn:function(){setDock(di.concat(a.id))}});
  else items.push({label:t('Add to dock...'),stay:true,fn:function(){
    openMenu(t('Replace which app?'),di.map(function(id,i){return {label:title(id),fn:function(){var d=di.slice();d[i]=a.id;setDock(d)}}}))}});
  items.push({label:t('Hide app'),fn:function(){hideApp(a.id)}});
  openMenu(a.title,items)}

function removeButton(o){cfg.topbar=topbar().filter(function(b){return b!==o});saveCfg()}
function barMenu(o){openMenu(barLabel(o),[{label:t('Remove this button'),fn:function(){removeButton(o)}}])}

function customizeMenu(){
  openMenu(t('Customise'),[
    {icon:'grid',label:'Dock',sub:t('hold OK on an app'),stay:true,fn:function(){toast(t('Hold OK on any app to change the dock'))}},
    {icon:'settings',label:t('Top buttons'),stay:true,fn:topButtonsMenu},
    {icon:'edit',label:t('Hidden apps'),stay:true,fn:hiddenMenu},
    {icon:'grid',label:t('App order'),sub:cfg.sort==='alpha'?t('A to Z'):t('Most used first'),fn:function(){cfg.sort=cfg.sort==='alpha'?'usage':'alpha';saveCfg()}},
    {icon:'edit',label:t('Clock'),sub:cfg.clock==='24'?t('24-hour'):cfg.clock==='12'?t('12-hour'):t('Automatic'),fn:function(){cfg.clock=cfg.clock==='24'?'12':cfg.clock==='12'?'auto':'24';saveCfg();tick()}},
    {icon:'restore',label:t('Reset customisation'),fn:function(){cfg={};saveCfg()}}])}
function topButtonsMenu(){
  var items=topbar().map(function(o){return {label:barLabel(o),sub:t('OK to remove'),fn:function(){removeButton(o)}}});
  items.push({label:t('Add a button...'),stay:true,fn:addButtonMenu});
  openMenu(t('Top buttons'),items)}
function addButtonMenu(){
  var items=PRESETS.map(function(p){return {icon:p.icon,label:barLabel(p),fn:function(){cfg.topbar=topbar().concat([p]);saveCfg()}}});
  items.push({label:t('An app...'),stay:true,fn:function(){
    openMenu(t('Pick an app'),apps.slice().sort(function(a,b){return a.title.localeCompare(b.title)}).map(function(a){
      return {label:a.title,fn:function(){cfg.topbar=topbar().concat([{label:a.title,icon:'grid',app:a.id}]);saveCfg()}}}))}});
  openMenu(t('Add a button'),items)}
function hiddenMenu(){
  var h=(cfg.hidden||[]).filter(function(id){return apps.some(function(a){return a.id===id})});
  if(!h.length)return toast(t('No hidden apps'));
  openMenu(t('Hidden apps (OK to show again)'),h.map(function(id){return {label:title(id),fn:function(){unhideApp(id)}}}))}

/* ---------- layout ---------- */
function rebuild(){
  var by={};apps.forEach(function(a){by[a.id]=a});
  var di=dockIds(),dock=di.map(function(i){return by[i]});
  var rest=apps.filter(function(a){return !isHidden(a.id)&&di.indexOf(a.id)<0}).sort(byOrder);
  rest.push({id:'__undo',title:t('Restore LG Home'),sys:true,icon:'restore'});
  var oldE=rows[r]&&rows[r][c],keep=oldE&&oldE._a?oldE._a.id:null;
  if(oldE)oldE.classList.remove('f');
  var dk=$('dock'),gd=$('grid'),bar=$('bar');
  dk.textContent='';gd.textContent='';bar.textContent='';
  var d=dock.map(function(a){var t=tile(a);dk.appendChild(t);return t});
  var g=rest.map(function(a){var t=tile(a);gd.appendChild(t);return t});
  var tb=topbar().concat([{label:'Customise',icon:'edit',action:'customize',fixed:true}]).map(function(o){
    var p=document.createElement('div');p.className='pill';p._o=o;p.innerHTML=svg(o.icon)+'<span></span>';p.lastChild.textContent=barLabel(o);
    hit(p);bar.appendChild(p);return p});
  rows=[tb,d.length?d:tb];
  for(var i=0;i<g.length;i+=10)rows.push(g.slice(i,i+10));
  var nr=Math.min(r,rows.length-1),nc=c;
  if(keep&&tiles[keep]){var p=posOf(tiles[keep]);if(p){nr=p[0];nc=p[1]}}
  setFocus(nr,nc,true)}

function load(){api('/api/apps').then(function(x){
  if(x.version&&x.version!==VERSION&&!warned){warned=true;toast('Launcher '+VERSION+' and helper '+x.version+' differ: run the installer again')}
  usage=x.usage||{};
  var rank=Object.keys(usage).sort(function(a,b){return usage[b]-usage[a]});
  var sig=JSON.stringify([x.apps.map(function(a){return a.id}),x.config,rank]);
  if(sig===lastSig)return;lastSig=sig;
  apps=x.apps.map(function(a){return {id:a.id,title:a.title}});cfg=x.config||{};store();rebuild()
}).catch(function(){toast(t('Helper not reachable, retrying...'));setTimeout(load,3000)})}

/* ---------- input: tap OK to open, hold OK for options ---------- */
var downT=0,held=false,downEnter=false,swallowUp=false,pressT=0,lastKey=0,lastMX=-1,lastMY=-1,lastEnter=0;
function hit(e){
  e.addEventListener('mousedown',function(){held=false;clearTimeout(pressT);pressT=setTimeout(function(){held=true;options(e)},650)});
  e.addEventListener('mouseup',function(){clearTimeout(pressT)});
  e.addEventListener('click',function(){if(held){held=false;return}act(e)})}
function options(e){
  if(e._a&&!e._a.sys)appMenu(e._a);
  else if(e._o&&!e._o.fixed)barMenu(e._o)}

/* Pointer focus follows real pointer movement only: a tile sliding under a still cursor, a cursor jitter when
   the remote is picked up, or a pointer move right after a button press must not steal the focus. */
document.addEventListener('mousemove',function(ev){
  if(stack.length||Date.now()-lastKey<1500)return;
  if(lastMX<0){lastMX=ev.clientX;lastMY=ev.clientY;return}
  if(Math.abs(ev.clientX-lastMX)+Math.abs(ev.clientY-lastMY)<24)return;
  lastMX=ev.clientX;lastMY=ev.clientY;
  var el=ev.target.closest?ev.target.closest('.tile,.pill'):null,p=el&&posOf(el);
  if(p&&!(p[0]===r&&p[1]===c))setFocus(p[0],p[1])});

document.addEventListener('keydown',function(e){
  var k=e.keyCode;lastKey=Date.now();
  if(stack.length){
    if(k===13){if(downEnter&&Date.now()-lastEnter<1500){lastEnter=Date.now();e.preventDefault();return}downEnter=true;lastEnter=Date.now();swallowUp=true}
    if(menuKey(k))e.preventDefault();return}
  var len=rows[r].length;
  if(k===37&&c>0)setFocus(r,c-1);
  else if(k===39&&c<len-1)setFocus(r,c+1);
  else if(k===38&&r>0)setFocus(r-1,mapCol(len,rows[r-1].length,c));
  else if(k===40&&r<rows.length-1)setFocus(r+1,mapCol(len,rows[r+1].length,c));
  else if(k===13){
    /* webOS repeats keydown while OK is held, sometimes without e.repeat: only the first one starts the hold timer */
    if(!downEnter||Date.now()-lastEnter>1500){downEnter=true;held=false;clearTimeout(downT);var t=rows[r][c];downT=setTimeout(function(){held=true;options(t)},650)}
    lastEnter=Date.now()}
  else return;
  e.preventDefault()});
document.addEventListener('keyup',function(e){
  if(e.keyCode!==13)return;
  lastKey=Date.now();clearTimeout(downT);
  if(swallowUp){swallowUp=false;downEnter=false;return}
  if(downEnter&&!held)act(rows[r][c]);
  downEnter=false;held=false});
document.addEventListener('webOSRelaunch',load);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});

function tick(){var d=new Date();
  try{$('time').textContent=d.toLocaleTimeString(LOC,clockOpts());$('date').textContent=d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}
  catch(e){$('time').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}}
setInterval(tick,15000);tick();

/* first paint straight from the last known layout, then refresh from the helper */
try{var cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
  if(cached&&cached.apps&&cached.apps.length){apps=cached.apps;cfg=cached.cfg||{};usage=cached.usage||{};colors=cached.colors||{};rebuild()}}catch(e){}
load();
</script></body></html>
