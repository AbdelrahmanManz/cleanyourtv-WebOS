<!doctype html>
<html><head><meta charset="utf-8"><title>Notification</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;color:#f5f6f8}
#card{box-sizing:border-box;position:absolute;display:flex;flex-direction:column;gap:20px;width:640px;padding:28px;border-radius:44px;background:rgba(12,13,17,.95);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 30px 60px rgba(0,0,0,.55);opacity:0;transform:translateY(-24px);transition:opacity .35s ease-out,transform .35s ease-out}
#card.on{opacity:1;transform:none}
#img{display:none;box-sizing:border-box;width:100%;max-height:400px;object-fit:contain;border-radius:28px;background:#1c1e24}
#title{font-size:38px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
#text{font-size:28px;line-height:1.3;color:rgba(245,246,248,.78);white-space:pre-wrap}
#title:empty,#text:empty{display:none}
</style></head><body>
<div id="card"><img id="img" alt=""><div id="title"></div><div id="text"></div></div>
<script>
var card=document.getElementById('card'),img=document.getElementById('img'),timer=0;
try{webOSSystem.setInputRegion([{x:0,y:0,width:0,height:0}]);webOSSystem.setKeyMask([])}catch(e){}   // never take the remote or the pointer
function place(pos){
  var m=64,s=card.style;s.left=s.right=s.top=s.bottom='auto';
  if(/left/.test(pos))s.left=m+'px';else if(/center/.test(pos))s.left=(1920-640)/2+'px';else s.right=m+'px';
  if(/bottom/.test(pos))s.bottom=m+'px';else if(/middle/.test(pos))s.top='300px';else s.top=m+'px'}
function reveal(){requestAnimationFrame(function(){requestAnimationFrame(function(){card.classList.add('on')})})}   // only after the first full layout, so nothing jumps
function show(){
  var p={};try{p=JSON.parse(webOSSystem.launchParams||'{}')}catch(e){}
  card.classList.remove('on');
  document.getElementById('title').textContent=p.title||'';document.getElementById('text').textContent=p.text||'';
  place(p.position||'top-right');
  clearTimeout(timer);
  timer=setTimeout(function(){card.classList.remove('on');setTimeout(function(){try{window.close()}catch(e){}},500)},Math.max(2,Math.min(120,p.seconds||8))*1000+500);
  if(!p.image){img.style.display='none';img.removeAttribute('src');reveal();return}
  // load the picture first, then show the finished card in one go
  var im=new Image(),done=false,go=function(ok){if(done)return;done=true;if(ok){img.src=p.image;img.style.display='block'}else{img.style.display='none'}reveal()};
  im.onload=function(){go(true)};im.onerror=function(){go(false)};setTimeout(function(){go(false)},3000);im.src=p.image}
document.addEventListener('webOSRelaunch',show);
show();
</script></body></html>
