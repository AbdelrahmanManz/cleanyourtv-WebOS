# The same checks as a test build (tools/check.sh: the tests under Node 8.12.0 and the current Node, the built pages), for pull requests
# and for main, so a change from a fork or a merge is checked too. Branch pushes are checked by test-build.yml.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: sh tools/check.sh
      - name: The package builds
        run: python3 ipk/build.py
